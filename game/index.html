<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Tide — a lantern-keeper's night</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #070a1e;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  #hint {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    color: rgba(220, 230, 255, 0.55);
    font: 12px/1.4 system-ui, sans-serif;
    letter-spacing: 0.08em;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="480"></canvas>
  <div id="hint">ARROWS / WASD / MOUSE — GLIDE &nbsp;·&nbsp; P — PAUSE &nbsp;·&nbsp; M — MUTE &nbsp;·&nbsp; R — RESTART</div>
</div>
<script src="src/util.js"></script>
<script src="src/audio.js"></script>
<script src="src/world.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
